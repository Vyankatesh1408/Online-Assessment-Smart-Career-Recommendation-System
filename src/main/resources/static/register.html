<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | Online Assessment System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-6">

            <div class="card shadow-lg">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">

                        Register

                    </h2>

                    <form id="registerForm">

                        <div class="mb-3">

                            <label class="form-label">

                                Full Name

                            </label>

                            <input
                                    type="text"
                                    id="fullName"
                                    class="form-control"
                                    placeholder="Enter Full Name"
                                    required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Email

                            </label>

                            <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    placeholder="Enter Email"
                                    required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Password

                            </label>

                            <input
                                    type="password"
                                    id="password"
                                    class="form-control"
                                    placeholder="Enter Password"
                                    required>

                        </div>

                        <div class="d-grid">

                            <button
                                    type="submit"
                                    class="btn btn-primary">

                                Register

                            </button>

                        </div>

                    </form>

                    <p class="text-center mt-3">

                        Already have an account?

                        <a href="login.html">

                            Login

                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="js/register.js"></script>

</body>

</html>
